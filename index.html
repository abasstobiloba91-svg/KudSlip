<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    
    <title>KudiSlip</title>

    <style>
      /* =========================================================
         MOBILE STABILIZER (NATIVE APP FEEL)
         ========================================================= */
      html, body {
        /* Stop the pull-to-refresh bounce effect */
        overscroll-behavior-y: none; 
        
        /* Lock the height to the exact screen size */
        height: 100dvh; 
        min-height: -webkit-fill-available; 
        width: 100vw;
        
        /* Remove all browser margins */
        margin: 0;
        padding: 0;
        
        /* Freeze the main window so the URL bar doesn't trigger jumps */
        overflow: hidden; 
        position: fixed; 
      }

      #root {
        /* Move the scrolling inside the React app container */
        height: 100%;
        width: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch; 
      }

      /* Prevent iOS Auto-Zoom on form fields */
      input, select, textarea {
        font-size: 16px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
