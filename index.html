<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>KudiSlip</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <style>
      /* =========================================================
         GLOBAL REBRAND VARIABLES (DARK MODE + NEON)
         ========================================================= */
      :root {
        --neon-blue: #2B39FF;
        --neon-green: #C6FF00;
        --bg-primary: #0A0F1C; /* Deep dark blue/black canvas */
        --bg-card: #111827; /* Slightly lighter dark for cards/inputs */
        --border-dark: #1E293B; 
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
      }

      /* =========================================================
         MOBILE STABILIZER & GLOBAL BACKGROUND
         ========================================================= */
      html, body {
        overscroll-behavior-y: none; 
        height: 100dvh; 
        min-height: -webkit-fill-available; 
        width: 100vw;
        margin: 0;
        padding: 0;
        overflow: hidden; 
        position: fixed; 
        
        /* 🎯 REBRAND BACKGROUND APPLIED GLOBALLY */
        background: var(--bg-primary); 
        color: var(--text-main); 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        -webkit-font-smoothing: antialiased;
      }

      #root {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch; 
      }

      input, select, textarea {
        font-size: 16px !important;
      }

      /* =========================================================
         NEW REBRAND UTILITIES (TYPOGRAPHY & PILL BUTTONS)
         ========================================================= */
      .heading-massive {
        font-family: 'Arial Black', Impact, sans-serif;
        text-transform: uppercase;
        line-height: 0.95;
        letter-spacing: -1.5px;
        margin-bottom: 16px;
        color: var(--text-main);
      }

      .heading-card {
        font-family: 'Arial Black', Impact, sans-serif;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        color: var(--text-main);
      }

      .btn-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 32px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
        transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
        cursor: pointer;
        border: none;
      }
      .btn-pill:hover { transform: translateY(-2px); opacity: 0.9; }

      .btn-blue { background: var(--neon-blue); color: white; box-shadow: 0 4px 15px rgba(43, 57, 255, 0.3); }
      .btn-green { background: var(--neon-green); color: #000000; box-shadow: 0 4px 15px rgba(198, 255, 0, 0.2); }
      .btn-dark { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-dark); }

      /* =========================================================
         LEGACY GLOBAL UI STYLES (Upgraded to Dark Mode)
         ========================================================= */
      *, *::before, *::after { box-sizing: border-box; }

      .btn-primary { padding: 14px 28px; background: var(--neon-green); color: #000000; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
      
      /* Dark mode form inputs */
      .form-input { width: 100%; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none; transition: all 0.2s ease; }
      .form-input:focus { border-color: var(--neon-green); box-shadow: 0 0 0 2px rgba(198, 255, 0, 0.2); }
      .form-input::placeholder { color: var(--text-muted); }

      /* =========================================================
         DASHBOARD LAYOUT STYLES (Upgraded to Dark Mode)
         ========================================================= */
      .dashboard-layout { display: flex; min-height: 100vh; flex-direction: row; }

      .sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border-dark); display: flex; flex-direction: column; padding-top: 32px; flex-shrink: 0; transition: transform 0.3s ease; height: 100vh; position: sticky; top: 0; overflow: hidden; }
      .sidebar-footer { padding: 24px 32px; border-top: 1px solid var(--border-dark); background: var(--bg-card); display: block; margin-top: 0; }
      
      .menu-btn { display: block; width: 100%; padding: 16px 32px; background: transparent; border: none; border-left: 4px solid transparent; color: var(--text-muted); text-align: left; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.15s ease; }
      .menu-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
      .menu-btn.active { background: rgba(198, 255, 0, 0.05); border-left: 4px solid var(--neon-green); color: var(--neon-green); font-weight: 700; }

      .main-content { flex: 1; padding: 48px; overflow-y: auto; background: var(--bg-primary); min-height: 100vh; }
      
      /* Login & Metric Cards */
      .metric-card, .login-card { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }

      /* =========================================================
         MOBILE RESPONSIVE BREAKPOINTS
         ========================================================= */
      @media (max-width: 768px) {
        .mobile-menu-toggle { display: block !important; background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-main); }
        .mobile-nav-dropdown.open { display: flex !important; flex-direction: column; gap: 12px; padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border-dark); }
        
        .mobile-dashboard-header { display: flex !important; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border-dark); z-index: 40; height: 68px; }
        
        .sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 280px; z-index: 50; transform: translateX(-100%); padding: 24px 0; box-shadow: 4px 0 25px rgba(0,0,0,0.5); overflow-y: auto; }
        .mobile-close-btn { display: block !important; color: var(--text-muted); padding: 8px; }
      }

      /* =========================================================
         🖨️ THE ULTIMATE A4 MOBILE PRINT FIX (Kept White for Paper)
         ========================================================= */
      @media print {
        @page { margin: 10mm; size: A4 portrait; }
        html, body, #root, .dashboard-layout, .main-content {
          background: #FFFFFF !important; color: #000000 !important; height: auto !important; min-height: auto !important; overflow: visible !important; display: block !important; position: static !important;
        }
        .no-print, .sidebar, .mobile-dashboard-header, .sidebar-overlay { display: none !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
